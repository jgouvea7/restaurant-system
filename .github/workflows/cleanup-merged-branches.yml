name: Cleanup merged branches

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete merged branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete merged remote branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin

          git for-each-ref \
            --merged origin/main \
            --format='%(refname:short)' \
            refs/remotes/origin \
            | sed 's#^origin/##' \
            | grep -E '^(feat|fix|chore|docs|refactor|test)/' \
            > /tmp/merged-branches.txt || true

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue

            echo "Deleting ${branch}"
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" \
              || echo "Branch ${branch} already deleted or protected"
          done < /tmp/merged-branches.txt
