name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            directory: auth
            test: true
          - service: user
            directory: user
            test: true
            shared: true
          - service: restaurant
            directory: restaurant
            test: true
            shared: true
          - service: aws
            directory: aws
            test: false
          - service: libs
            directory: libs
            test: false

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install shared packages
        if: matrix.shared
        working-directory: .
        run: |
          npm --prefix libs ci
          npm --prefix aws ci

      - name: Build shared packages
        if: matrix.shared
        working-directory: .
        run: |
          npm --prefix libs run build
          npm --prefix aws run build

      - name: Build
        run: npm run build

      - name: Test
        if: matrix.test
        run: npm test -- --runInBand

  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet
